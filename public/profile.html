<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shinobi Friends Book - My Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="gate-page">

    <div class="gate-overlay">

        <div class="profile-card">

            <!-- Header -->
            <div class="book-badge">
                <img
                    src="images/logo.png"
                    alt="Konoha logo"
                    class="book-logo"
                >
            </div>

            <p class="book-kicker">MY SHINOBI PAGE</p>
            <h1>Shinobi Friends Book</h1>
            <p class="book-subtitle">Tell us about your ninja life</p>

            <!-- Profile form -->
            <form action="/profile" method="POST" class="profile-form">

                <!-- Village -->
                <label for="village">My village</label>

                <select name="village" id="village" required>
                    <option value="">Choose your village</option>
                    <option value="Hidden Leaf">Hidden Leaf</option>
                    <option value="Hidden Sand">Hidden Sand</option>
                    <option value="Hidden Mist">Hidden Mist</option>
                    <option value="Hidden Cloud">Hidden Cloud</option>
                    <option value="Hidden Stone">Hidden Stone</option>
                </select>

                <!-- Clan -->
                <label for="clan">My clan</label>

                <select name="clan" id="clan">
                    <option value="">Choose your clan</option>
                    <option value="Uchiha">Uchiha</option>
                    <option value="Hyuga">Hyuga</option>
                    <option value="Nara">Nara</option>
                    <option value="Akimichi">Akimichi</option>
                    <option value="Yamanaka">Yamanaka</option>
                    <option value="Aburame">Aburame</option>
                    <option value="Inuzuka">Inuzuka</option>
                    <option value="Sarutobi">Sarutobi</option>
                    <option value="Uzumaki">Uzumaki</option>
                    <option value="Senju">Senju</option>
                    <option value="Other">Other / No clan</option>
                </select>

                <!-- Rank -->
                <label for="rank">My ninja rank</label>

                <select name="rank" id="rank">
                    <option value="">Choose your rank</option>
                    <option value="Academy Student">Academy Student</option>
                    <option value="Genin">Genin</option>
                    <option value="Chunin">Chunin</option>
                    <option value="Jonin">Jonin</option>
                </select>

                <!-- Chakra nature -->
                <label for="chakra">My chakra nature</label>

                <select name="chakra" id="chakra">
                    <option value="">Choose your chakra nature</option>
                    <option value="Fire">Fire</option>
                    <option value="Wind">Wind</option>
                    <option value="Lightning">Lightning</option>
                    <option value="Earth">Earth</option>
                    <option value="Water">Water</option>
                </select>

                <!-- Favorite jutsu -->
                <label for="jutsu">My favorite jutsu</label>

                <input
                    type="text"
                    name="jutsu"
                    id="jutsu"
                    placeholder="For example: Shadow Clone Jutsu"
                >

                <!-- Favorite food -->
                <label for="food">My favorite food</label>

                <input
                    type="text"
                    name="food"
                    id="food"
                    placeholder="For example: Ramen"
                >

                <!-- Dream -->
                <label for="dream">My dream</label>

                <textarea
                    name="dream"
                    id="dream"
                    rows="3"
                    placeholder="What do you want to achieve?"
                ></textarea>

                <!-- Best trait -->
                <label for="trait">My best trait</label>

                <input
                    type="text"
                    name="trait"
                    id="trait"
                    placeholder="For example: Loyal"
                >

                <!-- Weakness -->
                <label for="weakness">My biggest weakness</label>

                <input
                    type="text"
                    name="weakness"
                    id="weakness"
                    placeholder="For example: Impatient"
                >

                <!-- Dream team -->
                <label for="team">My dream ninja team</label>

                <textarea
                    name="team"
                    id="team"
                    rows="3"
                    placeholder="Who would you choose?"
                ></textarea>

                <!-- Message -->
                <label for="message">Message for the book</label>

                <textarea
                    name="message"
                    id="message"
                    rows="4"
                    placeholder="Write something for your friends..."
                ></textarea>

                <button type="submit">
                    Save My Shinobi Page
                </button>

            </form>

            <!-- Footer -->
            <div class="book-footer">
                <a href="/">Log out</a>
            </div>

        </div>

    </div>

</body>
</html>
