<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Friends Book - My Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="gate-page">
<div class="gate-overlay">
    <div class="profile-card">
        <div class="book-badge">
            <img src="images/logo.png" alt="Konoha logo" class="book-logo">
        </div>
        <p class="book-kicker">MY SHINOBI PAGE</p>
        <h1>Shinobi Friends Book</h1>
        <p class="book-subtitle">Tell us about your ninja life</p>

        <form action="/profile" method="POST" class="profile-form">
            <label for="village">My village</label>
            <select name="village" id="village" required>
                <option value="">Choose your village</option>
                <option>Hidden Leaf</option><option>Hidden Sand</option><option>Hidden Mist</option>
                <option>Hidden Cloud</option><option>Hidden Stone</option>
            </select>

            <label for="clan">My clan</label>
            <select name="clan" id="clan">
                <option value="">Choose your clan</option>
                <option>Uchiha</option><option>Hyuga</option><option>Nara</option><option>Akimichi</option>
                <option>Yamanaka</option><option>Aburame</option><option>Inuzuka</option><option>Sarutobi</option>
                <option>Uzumaki</option><option>Senju</option><option value="Other">Other / No clan</option>
            </select>

            <label for="rank">My ninja rank</label>
            <select name="rank" id="rank">
                <option value="">Choose your rank</option>
                <option>Academy Student</option><option>Genin</option><option>Chunin</option><option>Jonin</option>
            </select>

            <label for="chakra">My chakra nature</label>
            <select name="chakra" id="chakra">
                <option value="">Choose your chakra nature</option>
                <option>Fire</option><option>Wind</option><option>Lightning</option><option>Earth</option><option>Water</option>
            </select>

            <label for="jutsu">My favorite jutsu</label>
            <input type="text" name="jutsu" id="jutsu" placeholder="For example: Shadow Clone Jutsu">

            <label for="food">My favorite food</label>
            <input type="text" name="food" id="food" placeholder="For example: Ramen">

            <label for="dream">My dream</label>
            <textarea name="dream" id="dream" rows="3" placeholder="What do you want to achieve?"></textarea>

            <label for="trait">My best trait</label>
            <input type="text" name="trait" id="trait" placeholder="For example: Loyal">

            <label for="weakness">My biggest weakness</label>
            <input type="text" name="weakness" id="weakness" placeholder="For example: Impatient">

            <label for="team">My dream ninja team</label>
            <textarea name="team" id="team" rows="3" placeholder="Who would you choose?"></textarea>

            <label for="message">Message for the book</label>
            <textarea name="message" id="message" rows="4" placeholder="Write something for your friends..."></textarea>

            <button type="submit">Save My Shinobi Page</button>
        </form>

        <div class="book-footer">
            <a href="/home.html">Back to home</a><br><br>
            <a href="/logout">Log out</a>
        </div>
    </div>
</div>

<script>
    const FIELDS = ["village", "clan", "rank", "chakra", "jutsu", "food",
                    "dream", "trait", "weakness", "team", "message"];

    fetch("/api/profile")
        .then(res => {
            if (res.status === 401) return location.href = "/";
            if (!res.ok) throw new Error(res.status);
            return res.json().then(profile =>
                FIELDS.forEach(f => {
                    if (profile[f] != null) document.getElementById(f).value = profile[f];
                }));
        })
        .catch(err => console.error("Could not load profile:", err));
</script>
</body>
</html>
