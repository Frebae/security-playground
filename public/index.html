<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Shinobi Friends Book - Login
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="gate-page">


    <!-- ========================================
         BACKGROUND OVERLAY
         Darkens the background slightly
    ========================================= -->

    <div class="gate-overlay">


        <!-- ========================================
             LOGIN CARD
        ========================================= -->

        <div class="gate-card">


            <!-- ========================================
                 LOGO
            ========================================= -->

            <div class="book-badge">

                <img
                    src="images/logo.png"
                    alt="Shinobi Friends Book logo"
                    class="book-logo"
                >

            </div>


            <!-- ========================================
                 TITLE
            ========================================= -->

            <p class="book-kicker">
                KONOHA EDITION
            </p>

            <h1>
                Shinobi Friends Book
            </h1>

            <p class="book-subtitle">
                Enter the village and open your ninja page
            </p>


            <!-- ========================================
                 LOGIN FORM
            ========================================= -->

            <form
                action="/login"
                method="POST"
                class="book-form"
            >


                <!-- Email -->

                <label for="email">
                    Your email
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="naruto@leaf.com"
                    required
                >


                <!-- Password -->

                <label for="password">
                    Secret password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <span
                        class="toggle-password"
                        onclick="togglePassword()"
                        role="button"
                        tabindex="0"
                        aria-label="Show password"
                    >
                        👁
                    </span>

                </div>


                <!-- Login button -->

                <button type="submit">
                    Open My Book
                </button>


            </form>


            <!-- ========================================
                 REGISTER LINK
            ========================================= -->

            <div class="book-footer">

                <p>
                    No page in the book yet?
                </p>

                <a href="register.html">
                    Create your shinobi page
                </a>

            </div>


        </div>


    </div>


    <!-- ========================================
         PASSWORD TOGGLE
    ========================================= -->

    <script>

        function togglePassword() {

            const passwordInput =
                document.getElementById("password");

            const toggleIcon =
                document.querySelector(".toggle-password");


            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                toggleIcon.textContent = "🙈";

                toggleIcon.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            }

            else {

                passwordInput.type = "password";

                toggleIcon.textContent = "👁";

                toggleIcon.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }

    </script>


</body>

</html>
