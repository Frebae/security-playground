<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Friends Book - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="gate-page">
<div class="gate-overlay">
    <div class="gate-card">
        <div class="book-badge">
            <img src="images/logo.png" alt="Shinobi Friends Book logo" class="book-logo">
        </div>
        <p class="book-kicker">KONOHA EDITION</p>
        <h1>Shinobi Friends Book</h1>
        <p class="book-subtitle">Enter the village and open your ninja page</p>

        <form action="/login" method="POST" class="book-form">
            <label for="email">Your email</label>
            <input type="email" name="email" id="email" placeholder="naruto@leaf.com" required>

            <label for="password">Secret password</label>
            <div class="password-wrapper">
                <input type="password" name="password" id="password" placeholder="Enter your password" required>
                <span class="toggle-password" onclick="togglePassword(this)"
                      role="button" tabindex="0" aria-label="Show password">👁</span>
            </div>

            <button type="submit">Open My Book</button>
        </form>

        <div class="book-footer">
            <p>No page in the book yet?</p>
            <a href="register.html">Create your shinobi page</a>
        </div>
    </div>
</div>

<script>
    function togglePassword(icon) {
        const input = document.getElementById("password");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        icon.textContent = show ? "🙈" : "👁";
        icon.setAttribute("aria-label", show ? "Hide password" : "Show password");
    }
</script>
</body>
</html>
