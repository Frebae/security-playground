<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinobi Friends Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="gate-page">
<div class="gate-overlay">
    <div class="profile-card">
        <div class="book-badge">
            <img src="images/logo.png" alt="Konoha logo" class="book-logo">
        </div>
        <p class="book-kicker">SHINOBI PROFILE</p>
        <h1 id="username">Loading...</h1>
        <p class="book-subtitle">Shinobi Friends Book</p>

        <div class="view-profile" id="view-profile"></div>

        <div class="book-footer">
            <a href="/home.html">Back to home</a>
        </div>
    </div>
</div>

<script>
    const FIELDS = {
        village: "Village", clan: "Clan", rank: "Ninja rank", chakra: "Chakra nature",
        jutsu: "Favorite jutsu", food: "Favorite food", dream: "Dream", trait: "Best trait",
        weakness: "Biggest weakness", team: "Dream ninja team", message: "Message for the book"
    };

    // Bouw de antwoordvakjes op
    document.getElementById("view-profile").innerHTML = Object.entries(FIELDS)
        .map(([id, label]) => `<div class="profile-answer"><span>${label}</span><p id="${id}">-</p></div>`)
        .join("");

    const title = document.getElementById("username");
    const userId = new URLSearchParams(location.search).get("id");

    if (!userId) {
        title.textContent = "User not found";
    } else {
        fetch(`/api/users/${encodeURIComponent(userId)}`)
            .then(res => {
                if (res.status === 401) return location.href = "/";
                if (res.status === 404) return title.textContent = "User not found";
                if (!res.ok) throw new Error(res.status);
                return res.json().then(user => {
                    title.textContent = user.username;
                    for (const f in FIELDS)
                        document.getElementById(f).textContent = user[f] || "Not filled in";
                });
            })
            .catch(err => console.error("Could not load user profile:", err));
    }
</script>
</body>
</html>
