<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Shinobi Friends Book - Register
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="gate-page">


    <!-- ========================================
         BACKGROUND OVERLAY
    ========================================= -->

    <div class="gate-overlay">


        <!-- ========================================
             REGISTER CARD
        ========================================= -->

        <div class="gate-card">


            <!-- ========================================
                 LOGO
            ========================================= -->

            <div class="book-badge">

                <img
                    src="images/logo.png"
                    alt="Shinobi Friends Book logo"
                    class="book-logo"
                >

            </div>


            <!-- ========================================
                 HEADER
            ========================================= -->

            <p class="book-kicker">
                NEW SHINOBI PAGE
            </p>

            <h1>
                Add Yourself to the Book
            </h1>

            <p class="book-subtitle">
                Create your Shinobi Friends Book account
            </p>


            <!-- ========================================
                 REGISTER FORM
            ========================================= -->

            <form
                action="/register"
                method="POST"
                class="book-form"
                id="register-form"
            >


                <!-- Username -->

                <label for="username">
                    Shinobi name
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Choose your ninja name"
                    required
                >


                <!-- Email -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="naruto@leaf.com"
                    required
                >


                <!-- ========================================
                     PASSWORD
                ========================================= -->

                <label for="password">
                    Secret password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                    <span
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                        role="button"
                        tabindex="0"
                        aria-label="Show password"
                    >
                        👁
                    </span>

                </div>


                <!-- ========================================
                     CONFIRM PASSWORD
                ========================================= -->

                <label for="confirm-password">
                    Confirm password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Enter your password again"
                        required
                    >

                    <span
                        class="toggle-password"
                        onclick="togglePassword('confirm-password', this)"
                        role="button"
                        tabindex="0"
                        aria-label="Show password"
                    >
                        👁
                    </span>

                </div>


                <!-- Error message -->

                <p
                    id="password-error"
                    class="form-error"
                ></p>


                <!-- Register button -->

                <button type="submit">
                    Create My Page
                </button>


            </form>


            <!-- ========================================
                 BACK TO LOGIN
            ========================================= -->

            <div class="book-footer">

                <p>
                    Already in the book?
                </p>

                <a href="/">
                    Go back to login
                </a>

            </div>


        </div>


    </div>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        // ========================================
        // SHOW / HIDE PASSWORD
        // ========================================

        function togglePassword(inputId, icon) {

            const passwordInput =
                document.getElementById(inputId);


            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                icon.textContent = "🙈";

                icon.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            }

            else {

                passwordInput.type = "password";

                icon.textContent = "👁";

                icon.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }


        // ========================================
        // PASSWORD CONFIRMATION
        // ========================================

        const registerForm =
            document.getElementById("register-form");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirm-password");

        const passwordError =
            document.getElementById("password-error");


        registerForm.addEventListener(
            "submit",
            function (event) {

                if (
                    password.value !==
                    confirmPassword.value
                ) {

                    // Stop the form from being submitted
                    event.preventDefault();

                    // Show error message
                    passwordError.textContent =
                        "Passwords do not match.";

                }

                else {

                    passwordError.textContent = "";

                }

            }
        );

    </script>


</body>

</html>
