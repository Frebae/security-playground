<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shinobi Friends Book - Register</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <!-- ========================================
         FRIENDS BOOK PAGE
    ========================================= -->

    <div class="book-page">


        <!-- ========================================
             HEADER
        ========================================= -->

        <div class="book-header">

            <div class="book-badge">
                🍥
            </div>

            <p class="book-kicker">
                NEW SHINOBI PAGE
            </p>

            <h1>
                Add Yourself to the Book
            </h1>

            <p class="book-subtitle">
                First create your account
            </p>

        </div>


        <!-- ========================================
             REGISTER FORM
        ========================================= -->

        <form
            action="/register"
            method="POST"
            class="book-form"
        >


            <!-- Username -->

            <label for="username">
                Shinobi name
            </label>

            <input
                type="text"
                name="username"
                id="username"
                placeholder="Choose your ninja name"
                required
            >


            <!-- Email -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                name="email"
                id="email"
                placeholder="you@konoha.com"
                required
            >


            <!-- Password -->

            <label for="password">
                Secret password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword()"
                    role="button"
                    tabindex="0"
                    aria-label="Show password"
                >
                    👁
                </span>

            </div>


            <!-- Button -->

            <button type="submit">
                Create My Page
            </button>

        </form>


        <!-- ========================================
             BACK TO LOGIN
        ========================================= -->

        <div class="book-footer">

            <p>
                Already in the book?
            </p>

            <a href="/">
                Go back to login
            </a>

        </div>


        <!-- Decorative doodles -->

        <div class="doodle doodle-left">
            ✎
        </div>

        <div class="doodle doodle-right">
            ☁
        </div>


    </div>


    <!-- ========================================
         PASSWORD TOGGLE
        ========================================= -->

    <script>

        function togglePassword() {

            const passwordInput =
                document.getElementById("password");

            const toggleIcon =
                document.querySelector(".toggle-password");


            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                toggleIcon.textContent = "🙈";

            }

            else {

                passwordInput.type = "password";
                toggleIcon.textContent = "👁";

            }

        }

    </script>


</body>

</html>
