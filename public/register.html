<!DOCTYPE html>

<html lang="en">


<!-- ========================================
     1. HEAD
     Page settings and metadata
========================================= -->

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register
    </title>

    <!-- Connect the CSS file -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<!-- ========================================
     2. BODY
     Everything visible on the page
========================================= -->

<body>


    <!-- ========================================
         3. REGISTER CONTAINER
         Main box containing the form
    ========================================= -->

    <div class="login-container">


        <!-- Page title -->

        <h1>
            Create account
        </h1>


        <!-- ========================================
             4. REGISTER FORM
             Sends the entered data to /register
        ========================================= -->

        <form
            action="/register"
            method="POST"
        >


            <!-- ========================================
                 USERNAME FIELD
            ========================================= -->

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >


            <!-- ========================================
                 EMAIL FIELD
            ========================================= -->

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >


            <!-- ========================================
                 PASSWORD FIELD
                 Eye icon is placed inside the field
            ========================================= -->

            <div class="password-wrapper">

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword()"
                    role="button"
                    tabindex="0"
                    aria-label="Show password"
                >
                    👁
                </span>

            </div>


            <!-- ========================================
                 REGISTER BUTTON
            ========================================= -->

            <button type="submit">
                Register
            </button>


        </form>


        <!-- ========================================
             BACK TO LOGIN
        ========================================= -->

        <a href="/">
            Already have an account? Login
        </a>


    </div>


    <!-- ========================================
         5. JAVASCRIPT
         Shows or hides the password
    ========================================= -->

    <script>

        function togglePassword() {

            // Find the password input
            const passwordInput =
                document.getElementById("password");

            // Find the eye icon
            const toggleIcon =
                document.querySelector(".toggle-password");


            // If password is hidden, show it
            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                toggleIcon.textContent = "🙈";

                toggleIcon.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            }

            // Otherwise hide it again
            else {

                passwordInput.type = "password";

                toggleIcon.textContent = "👁";

                toggleIcon.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }


        // Also allow Enter or Space to toggle
        // the password when the icon is selected

        document
            .querySelector(".toggle-password")
            .addEventListener("keydown", function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    togglePassword();

                }

            });

    </script>


</body>

</html>
